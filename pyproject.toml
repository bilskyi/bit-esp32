[project]
name = "voice-companion-server"
version = "0.1.0"
description = "Server for a push-to-talk ESP32-C3 voice companion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "av>=18.1.0",
    "fastembed>=0.5",
]

[dependency-groups]
dev = [
    "numpy>=2.5.2",
    "pyserial>=3.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "websockets>=13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    # starlette's TestClient still imports httpx; nothing we can do from here.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.uv]
package = false
